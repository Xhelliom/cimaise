/* Maquette du bandeau (07/11). Deux variantes : #a = bandeau haut (image 1280×480 à droite), #b = fond plein écran derrière les rangées.

.hero{position:absolute;left:0;top:0;width:1920px;overflow:hidden}

.a .hero{height:480px}
.a .art{left:640px;top:0;width:1280px;height:720px}

.b .hero{height:1080px}
.b .art{left:0;top:0;width:1920px;height:1080px}

.tete{top:40px;gap:16px;align-items:center}

.tete .og.on{color:#000;background:#e5a00d}
.tete .sep{width:8px}
/* Texte du bandeau */
.info{position:absolute;left:120px;top:156px;width:820px}
.info h1{margin:0;font-size:64px;font-weight:500;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .ep{margin-top:6px;font-size:30px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .meta{margin-top:14px;display:flex;align-items:center;gap:14px;font-size:28px;color:rgba(255,255,255,.75)}
.age{display:inline-block;padding:0 12px;border:2px solid rgba(255,255,255,.55);border-radius:6px;font-size:24px;line-height:34px}
.info p{margin:18px 0 0;height:84px;overflow:hidden;font-size:28px;line-height:42px;color:rgba(255,255,255,.82)}
.jg{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:24px;color:rgba(255,255,255,.75)}
.jg i{display:block;width:320px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.jg i b{display:block;height:6px;background:#e5a00d}

.pr{background:#e5a00d}
.rangee{transition:transform .25s ease}
.rangs{position:absolute;left:0;top:488px;width:1920px;height:592px;overflow:hidden}
.r1{top:0;height:548px}.r2{top:560px;height:548px}
.rangee h2{font-size:34px}
.piste{padding-top:24px}
.bord{top:48px}
.b .bord.d{background:linear-gradient(to left,rgba(11,11,13,.8) 15%,rgba(11,11,13,0))}
.pick{position:absolute;right:40px;bottom:24px;font-size:22px;color:rgba(255,255,255,.4)}
</style></head>

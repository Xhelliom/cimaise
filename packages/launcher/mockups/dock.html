<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>cimaise — maquette dock</title><link rel="stylesheet" href="mockups.css"></head>
<body class="dock">
<div class="fond on" style="background:radial-gradient(ellipse 70% 60% at 32% 42%,rgba(229,9,20,.5),rgba(11,11,13,0) 75%)"></div>
<div class="fond"></div>
<header><div class="salut">Bonsoir</div><div class="heure"><span class="horloge">20:45</span><span class="sep"></span><span class="date">jeudi 29 octobre</span></div></header>
<nav class="pastilles"><a class="pastille" tabindex="0">Réglages</a><a class="pastille" tabindex="0">Smart Hub</a><a class="pastille" tabindex="0">Réseau</a></nav>
<h1 class="titre">Netflix</h1>
<main class="bac">
<a class="tuile" data-nom="Plex intégré" data-rgb="229,160,13" style="--c:#e5a00d;--k:#1f1f1f">P</a>
<a class="tuile" data-nom="Plex" data-rgb="75,80,87" style="--c:#3a3d42;--k:#e5a00d">P</a>
<a class="tuile focus" data-nom="Netflix" data-rgb="229,9,20" style="--c:#e50914">N</a>
<a class="tuile" data-nom="YouTube" data-rgb="214,32,31" style="--c:#c4302b">Y</a>
<a class="tuile" data-nom="Disney+" data-rgb="17,60,207" style="--c:#113ccf">D</a>
<a class="tuile" data-nom="Canal+" data-rgb="90,90,95" style="--c:#2b2b2e">C</a>
</main>
<script>
(function(){
var t=document.querySelectorAll(".tuile"),f=document.querySelectorAll(".fond"),ti=document.querySelector(".titre"),i=2,c=0,h=/^#(\d)$/.exec(location.hash);
function go(n){
 if(n<0||n>=t.length||n===i)return;
 t[i].className="tuile";i=n;t[i].className="tuile focus";ti.textContent=t[i].getAttribute("data-nom");
 var nx=f[1-c],old=f[c];
 nx.style.background="radial-gradient(ellipse 70% 60% at 32% 42%,rgba("+t[i].getAttribute("data-rgb")+",.5),rgba(11,11,13,0) 75%)";
 nx.style.zIndex=2;old.style.zIndex=1;
 void nx.offsetWidth;nx.className="fond on";
 setTimeout(function(){old.className="fond"},650);
 c=1-c;
}
document.addEventListener("keydown",function(e){var k=e.keyCode;if(k===37)go(i-1);else if(k===39)go(i+1);else if(k===38)go(i-4);else if(k===40)go(i+4)});
if(h)go(+h[1]);
})();
</script>
</body></html>
